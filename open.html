<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open DayPrism</title>
  <meta http-equiv="refresh" content="0; url=dayprism://open">
  <link rel="icon" type="image/png" href="/assets/dayprism_transparent.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
      padding: 20px;
    }
    .container {
      text-align: center;
      padding: 48px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 400px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .button {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }
    .subtext {
      margin-top: 24px;
      font-size: 13px;
      color: #9ca3af;
    }
    .subtext a {
      color: #8b5cf6;
      text-decoration: none;
    }
    .subtext a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/dayprism_transparent.png" alt="DayPrism" class="logo">
    <h1>Opening DayPrism...</h1>
    <p>If the app doesn't open automatically, click the button below.</p>
    <a href="dayprism://open" class="button">Open DayPrism</a>
    <p class="subtext">
      Don't have DayPrism? <a href="/">Learn more</a>
    </p>
  </div>
</body>
</html>
